[project]
name = "optiroute"
version = "0.1.0"
description = "Adaptive Capability-Based Hybrid AI Routing Framework"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.139.0",
    "uvicorn>=0.50.2",
    "pydantic-settings>=2.9.0",
    "httpx>=0.28.0",
    "requests>=2.32.0",
    "openai>=1.82.0",
    "numpy>=2.2.0",
    "structlog>=25.1.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=1.0.0",
    "pydantic>=2.13.4",
    "uvloop>=0.21.0;sys_platform!='win32'",
    "llama-cpp-python>=0.3.33",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
